[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/unbloated_sphinx_theme/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/unbloated_sphinx_theme"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.rst",
    "pyproject.toml",
]

[project]
name = "unbloated-sphinx-theme"
dynamic = ["version"]
description = "A minimal, clean Sphinx theme with a monospace aesthetic."
readme = "README.rst"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Sphinx>=9.0",
]

[dependency-groups]
doc = [
  "jupyterlab==4.5.7",
  "jupytext==1.19.2",
  "matplotlib==3.10.9",
  "myst-parser==5.1.0",
  "nbconvert==7.17.1",
  "nbsphinx==0.9.8",
  "plotly==6.6.0",
  "sphinx-copybutton==0.5.2",
]

[project.entry-points."sphinx.html_themes"]
unbloated_sphinx_theme = "unbloated_sphinx_theme"

[project.urls]
Source = "https://github.com/jorgemartinez/unbloated-sphinx-theme"
Documentation = "https://jorgemartinez.space/projects/unbloated-sphinx-theme/version/stable/"
Tracker = "https://github.com/jorgemartinez/unbloated-sphinx-theme/issues"

[tool.towncrier]
directory = "doc/source/changelog"
filename = "doc/source/changelog.rst"
template = "doc/source/changelog/template"
start_string = ".. towncrier release notes start\n"
title_format = "`{version} <https://github.com/jorgepiloto/unbloated-sphinx-theme/releases/tag/v{version}>`_ ({project_date})"
issue_format = "`#{issue} <https://github.com/jorgepiloto/unbloated-sphinx-theme/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true
