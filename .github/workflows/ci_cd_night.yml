name: night
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run-doc:
        description: Build and deploy documentation.
        required: true
        default: true
        type: boolean
      run-tests:
        description: Run browser and package tests.
        required: true
        default: true
        type: boolean

env:
  PROJECT_NAME: 'sphinx-unbloated-theme'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/sphinx-unbloated-theme'
  DOCUMENTATION_BASE_URL: >-
    https://jorgemartinez.space/projects/sphinx-unbloated-theme/version/dev/
  MAIN_PYTHON_VERSION: '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-wheelhouse:
    if: github.event_name != 'workflow_dispatch' || inputs.run-doc || inputs.run-tests
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and Install Wheel
        run: |
          uv build
          uv venv
          uv pip install dist/*.whl

      - name: Check Generated Theme
        run: uv run --no-project python -m unittest discover -s tests/python

      - name: Check Installed Theme
        run: |
          uv run --no-project python -c "from importlib.metadata import entry_points; from pathlib import Path; from sphinx_unbloated_theme import get_autoapi_templates_dir; assert any(ep.name == 'sphinx_unbloated_theme' for ep in entry_points(group='sphinx.html_themes')); assert (Path(get_autoapi_templates_dir()) / 'python' / 'class.rst').is_file()"

  doc-build:
    if: github.event_name != 'workflow_dispatch' || inputs.run-doc || inputs.run-tests
    name: Doc Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build Theme CSS
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm run build

      - name: Set Up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          tinytex: true

      - name: Install Pandoc and Tox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          uv tool install tox

      - name: Check Documentation Links
        shell: bash
        run: tox -e doc-links

      - name: Build HTML Documentation
        shell: bash
        run: tox -e doc-html

      - name: Upload HTML Documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-html
          path: doc/_build/html
          if-no-files-found: error

  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.run-tests
    name: Browser Tests
    needs: doc-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download Documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-html
          path: doc/_build/html

      - name: Run Browser Tests
        run: |
          npm ci
          npm audit
          npx playwright install --with-deps chromium firefox
          npm test

  doc-deploy-dev:
    name: Deploy Dev Docs
    needs: doc-build
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch'
      || inputs.run-doc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - name: Download Documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-html
          path: documentation-html

      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/sphinx-unbloated-theme/version/dev
