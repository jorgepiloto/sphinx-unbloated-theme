name: pull-request
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  PROJECT_NAME: 'sphinx-unbloated-theme'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/sphinx-unbloated-theme'
  DOCUMENTATION_BASE_URL: >-
    https://jorgemartinez.space/projects/sphinx-unbloated-theme/version/dev/
  MAIN_PYTHON_VERSION: '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  labeler:
    name: Labels
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:skip') && github.event.pull_request.head.repo.full_name
      == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Apply labels to pull requests.
    steps:
      - name: Label Pull Request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false

  actions-style:
    name: Actions Style Checks
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !contains(github.event.pull_request.labels.*.name,
      'style:skip')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  code-style:
    name: Code Style Checks
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !contains(github.event.pull_request.labels.*.name,
      'style:skip')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Run Style Checks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  build-wheelhouse:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: "!contains(github.event.pull_request.labels.*.name, 'ci:skip')"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and Install Wheel
        run: |
          uv build
          uv venv
          uv pip install dist/*.whl

      - name: Check Generated Theme
        run: uv run --no-project python -m unittest discover -s tests/python

      - name: Check Installed Theme
        run: |
          uv run --no-project python -c "from importlib.metadata import entry_points; from pathlib import Path; from sphinx_unbloated_theme import get_autoapi_templates_dir; assert any(ep.name == 'sphinx_unbloated_theme' for ep in entry_points(group='sphinx.html_themes')); assert (Path(get_autoapi_templates_dir()) / 'python' / 'class.rst').is_file()"

  doc-build:
    name: Doc Build
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !contains(github.event.pull_request.labels.*.name,
      'docs:skip')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build Theme CSS
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm run build

      - name: Set Up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          tinytex: true

      - name: Install Pandoc and Tox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          uv tool install tox

      - name: Build HTML Documentation
        shell: bash
        run: tox -e doc-html

      - name: Upload HTML Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-html
          path: doc/_build/html
          if-no-files-found: error

  tests:
    name: Browser Tests
    needs: doc-build
    if: "!contains(github.event.pull_request.labels.*.name, 'tests:skip')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download Documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-html
          path: doc/_build/html

      - name: Run Browser Tests
        run: |
          npm ci
          npm audit
          npx playwright install --with-deps chromium firefox
          npm test

  build-library:
    name: Build Library
    needs: [actions-style, code-style, build-wheelhouse, doc-build, tests]
    if: >-
      always() && !cancelled() && !contains(github.event.pull_request.labels.*.name,
      'ci:skip') && !contains(needs.*.result, 'failure') && needs.build-wheelhouse.result
      == 'success' && needs.doc-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build Distribution
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm run build
          uv build
          uvx twine check dist/*

      - name: Upload Distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sphinx-unbloated-theme-artifacts
          path: dist/*
          if-no-files-found: error
