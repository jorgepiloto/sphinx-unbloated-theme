name: release
on:
  push:
    tags: ['v*.*.*']

env:
  PROJECT_NAME: 'sphinx-unbloated-theme'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/sphinx-unbloated-theme'
  MAIN_PYTHON_VERSION: '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  actions-style:
    name: Actions Style Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check Workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  code-style:
    name: Code Style Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Run Style Checks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  build-wheelhouse:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Build and Install Wheel
        run: |
          uv build
          uv venv
          uv pip install dist/*.whl

      - name: Check Installed Theme
        run: |
          uv run --no-project python -c "from importlib.metadata import entry_points; from pathlib import Path; from sphinx_unbloated_theme import get_autoapi_templates_dir; assert any(ep.name == 'sphinx_unbloated_theme' for ep in entry_points(group='sphinx.html_themes')); assert (Path(get_autoapi_templates_dir()) / 'python' / 'class.rst').is_file()"

  doc-build:
    name: Doc Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set Up Node
        # setup-node v4.4.0 caches dependencies only when cache is set.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'

      - name: Build Theme CSS
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm install
          npm run build

      - name: Set Up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          tinytex: true

      - name: Install Pandoc and Tox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          uv tool install tox

      - name: Check Documentation Links
        shell: bash
        run: tox -e doc-links

      - name: Build HTML Documentation
        shell: bash
        run: tox -e doc-html

      - name: Upload HTML Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-html
          path: doc/_build/html
          if-no-files-found: error

  tests:
    name: Browser Tests
    needs: doc-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up Node
        # setup-node v4.4.0 caches dependencies only when cache is set.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'

      - name: Download Documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-html
          path: doc/_build/html

      - name: Run Browser Tests
        run: |
          npm install
          npx playwright install --with-deps chromium firefox
          npm test

  build-library:
    name: Build Library
    needs: [actions-style, code-style, build-wheelhouse, doc-build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set Up Node
        # setup-node v4.4.0 caches dependencies only when cache is set.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'

      - name: Build Distribution
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm install
          npm run build
          uv build
          uvx twine check dist/*

      - name: Check Release Version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging python - <<'PYTHON'
          from pathlib import Path
          import os
          import zipfile
          from email.parser import BytesParser
          from packaging.version import Version

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_path = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              version = BytesParser().parsebytes(archive.read(metadata_path))["Version"]
          assert Version(os.environ["RELEASE_TAG"].removeprefix("v")) == Version(version), "Release tag must match the package version"
          PYTHON

      - name: Upload Distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sphinx-unbloated-theme-artifacts
          path: dist/*
          if-no-files-found: error

  release-pypi:
    name: Release to PyPI
    needs: build-library
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Authenticate with PyPI using trusted publishing.
    steps:
      - name: Download Distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sphinx-unbloated-theme-artifacts
          path: dist

      - name: Publish Distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true

  release-github:
    name: Release to GitHub
    needs: release-pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Create the release and upload distribution files.
    steps:
      - name: Download Distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sphinx-unbloated-theme-artifacts
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

  doc-deploy-stable:
    name: Deploy Stable Docs
    needs: release-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - name: Download Documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-html
          path: documentation-html

      - name: Read Release Version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Deploy Versioned Documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/sphinx-unbloated-theme/version/${{ env.RELEASE_VERSION
            }}

      - name: Deploy Stable Documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/sphinx-unbloated-theme/version/stable
