name: main
on:
  push:
    branches:
      - main
env:
  PROJECT_NAME: 'unbloated-sphinx-theme'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/unbloated-sphinx-theme'
  MAIN_PYTHON_VERSION: '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  doc-build:
    name: "Doc build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout the project"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: "Setup Quarto"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          tinytex: true

      - name: "Setup Pandoc"
        run: |
          sudo apt-get install -y pandoc

      - name: "Install Tox"
        run: |
          uv tool install tox

      - name: "Build documentation"
        run: |
          tox -e doc-links,doc-html

      - name: "Upload documentation artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-html
          path: doc/_build/html

  doc-deploy-dev:
    name: "Doc deploy dev"
    runs-on: ubuntu-latest
    needs: doc-build
    permissions:
      contents: read
    steps:
      - name: "Download documentation artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: "Deploy documentation"
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/unbloated-sphinx-theme/version/dev
